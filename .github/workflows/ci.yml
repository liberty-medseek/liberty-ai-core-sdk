# Testa em todo push e PR. Publica um pacote por tag:
#
#   python-vX.Y.Z   publica liberty-ai no PyPI
#   node-vX.Y.Z     publica @libertyti/ai no npm
#
# Tag por pacote, e nao uma so para os dois, porque os registries se configuram
# em momentos diferentes e uma versao nem sempre muda os dois. O job falha se a
# versao do pacote divergir da tag, entao tag errada nao vira release errado.
name: ci

on:
  push:
    branches: [main]
    tags: ['python-v*', 'node-v*']
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      # O minimo que o pyproject declara e uma versao recente. Sem as duas, o
      # `requires-python` vira promessa que ninguem confere.
      matrix:
        versao: ['3.10', '3.13']
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.versao }}
      - run: pip install -e '.[dev]'
      - run: pytest -q

  node:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: node
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: node/package-lock.json
      - run: npm ci
      - run: npm run check

  publicar-python:
    needs: [python, node]
    if: startsWith(github.ref, 'refs/tags/python-v')
    runs-on: ubuntu-latest
    # Trusted publishing do PyPI: sem token guardado no repositorio.
    permissions:
      id-token: write
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: a tag tem de bater com a versao do pacote
        run: test "python-v$(grep -oE '[0-9]+\.[0-9]+\.[0-9]+' src/liberty/_version.py)" = "$GITHUB_REF_NAME"
      - run: pip install build
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist

  publicar-node:
    needs: [python, node]
    if: startsWith(github.ref, 'refs/tags/node-v')
    runs-on: ubuntu-latest
    # `id-token` alimenta o provenance do npm, que amarra o pacote a este commit.
    permissions:
      id-token: write
    defaults:
      run:
        working-directory: node
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: npm
          cache-dependency-path: node/package-lock.json
      - name: a tag tem de bater com a versao do pacote
        run: test "node-v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm ci
      - run: npm publish --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
